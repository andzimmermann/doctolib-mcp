name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m pytest -q
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run types:worker
      - run: npm run test:worker
      - name: Browser input regression
        shell: bash
        run: |
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --no-first-run --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/doctolib-input-chrome" about:blank > "$RUNNER_TEMP/doctolib-input-chrome.log" 2>&1 &
          task_chrome_pid=$!
          trap 'kill "$task_chrome_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9222/json/version > /dev/null; then break; fi
            sleep 1
          done
          node --test test-browser/*.test.mjs
